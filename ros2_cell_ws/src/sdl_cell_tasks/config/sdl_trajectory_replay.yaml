# task_params of sdl_trajectory_replay (sdl_cell_tasks/tasks/fr5/trajectory_replay.py, DEFAULTS).
#   ros2 launch cho_task_manager run_task_manager.launch.py robot_type:=fr5 task:=sdl_trajectory_replay \
#     home_via:=direct replay_layout:=<the cell's own layout file> task_params:=<this file>
# The recording and how it is replayed are the node's parameters (replay_trajectory:=, empty: the
# cell's recording, traj_level_seed2 in cho_task_manager's config/replay/fr5/; replay_layout:=,
# home_via:=, replay_speed_scale:=). The pour is this file's.
pour_controller: pouring_controller    # must be in the registry's fr5 additional_arm (sdl_cell_bringup)
replay_pour_grams: 20.0                # [g] poured where the recording pours; 0 replays the recorded pour
replay_pour_container: auto            # the EMPTY receiver's weight [g], or auto: read off the scale first
replay_pour_material: liquid           # liquid or granular
replay_pour_flow_index: 0.0            # 0..1 within the material class: 0 water or dry salt, 1 honey
replay_pour_timeout: 0.0               # [s] the pour law may take; 0 keeps the controller's
replay_pour_marker_topic: /perception/object_pose/held_beaker   # none: measured by the controller at the pour
replay_pour_required: false            # true: a pour that misses its target stops the replay
replay_pour_receiver: null             # [x, y, z] the receiver's rim centre in base_link [m], as perceived;
                                       #   required by a controller under pour_geometry: measured (the real
                                       #   cell's), unused under joint (MuJoCo's)
replay_pour_grasp_marker: null         # [x, y, z] the held vessel as perceived before planning; null: marker_topic
replay_pour_put_back: elsewhere        # start: set down where it was taken (the pose node restores its pose)
replay_pour_repeat: 1                  # pours made there, each after the first on /real_cell/trial_go
