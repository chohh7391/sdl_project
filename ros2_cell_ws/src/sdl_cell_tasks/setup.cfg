[develop]
script_dir=$base/lib/sdl_cell_tasks
[install]
install_scripts=$base/lib/sdl_cell_tasks

[tool:pytest]
# The anyio plugin a ROS 2 machine may have installed breaks collection here,
# as in cho_task_manager.
addopts = -p no:anyio

[flake8]
max-line-length = 120
# The optional flake8 plugins' rules are pinned off, as in every cho package:
# this code is written to pycodestyle + pyflakes only.
extend-ignore = A,B90,C4,C81,CNL,D,I,Q
per-file-ignores =
    __init__.py:F401
