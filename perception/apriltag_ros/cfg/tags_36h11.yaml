/**:
    ros__parameters:
        image_transport: raw    # image format
        family: 36h11           # tag family name
        # Edge of the tag's BLACK border, which is what solvePnP is given.
        # Measured, not assumed: the plate in beaker.usd / flask.usd is a 0.1 m
        # quad, but NVIDIA's AprilTag.mdl mosaic renders the black square at
        # 0.0781 +/- 0.0003 m, 2.4% under the nominal 0.8 x plate.  Measured by
        # projecting the tags' known world squares with the published K and
        # comparing the projected edge with the detector's own corners, over
        # three camera-tag pairs; the detected edge is invariant to image
        # resampling (+/-0.06 px), so this is geometry, not a pixel bias, and
        # the camera model is sound (tag centres reproject within 0.8 px,
        # implied fx 922.7-925.0 against the published 924.7).  Declaring the
        # nominal 0.08 biased range long by 2.4%, i.e. the vessel pose 32-40 mm
        # below the table.
        size: 0.0781            # tag edge size in meter
        max_hamming: 0          # maximum allowed hamming distance (corrected bits)

        # see "apriltag.h" 'struct apriltag_detector' for more documentation on these optional parameters
        detector:
            threads: 1          # number of threads
            decimate: 1.0       # decimate resolution for quad detection
            blur: 0.0           # sigma of Gaussian blur for quad detection
            refine: True        # snap to strong gradients
            sharpening: 0.25    # sharpening of decoded images
            debug: False        # write additional debugging images to current working directory


        pose_estimation_method: "pnp"   # method for estimating the tag pose

        # optional list of tags
        tag:
            ids: [0, 1]            # tag ID
            frames: [beaker_tag, flask_tag]  # optional frame name
            sizes: [0.0781, 0.0781]   # measured rendered edge; see note above
